
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Institute Registration Form</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background: #eef2f7;
    padding: 30px 15px;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}

.header {
    background: linear-gradient(135deg, #102b50, #1769aa);
    color: white;
    text-align: center;
    padding: 35px 20px;
}

.header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.header p {
    color: #dceaff;
}

.form-content {
    padding: 30px;
}

.section-title {
    color: #1769aa;
    font-size: 19px;
    margin: 25px 0 18px;
    padding-bottom: 8px;
    border-bottom: 2px solid #e5edf5;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: 600;
    margin-bottom: 7px;
    color: #26364a;
}

input, select, textarea {
    padding: 12px;
    border: 1px solid #ccd5df;
    border-radius: 7px;
    font-size: 14px;
    outline: none;
    width: 100%;
}

input:focus, select:focus, textarea:focus {
    border-color: #1769aa;
    box-shadow: 0 0 5px #1769aa44;
}

.full-width {
    grid-column: 1 / -1;
}

textarea {
    resize: vertical;
    min-height: 85px;
}

.gender-options {
    display: flex;
    gap: 20px;
    padding: 10px 0;
}

.gender-options label {
    font-weight: normal;
}

.gender-options input {
    width: auto;
}

.checkbox {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 25px 0;
}

.checkbox input {
    width: auto;
    margin-top: 4px;
}

button {
    width: 100%;
    padding: 14px;
    background: #1769aa;
    border: none;
    border-radius: 7px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #102b50;
}

.footer {
    text-align: center;
    padding: 18px;
    background: #f5f7fa;
    color: #667085;
    font-size: 13px;
}

@media(max-width: 600px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-content {
        padding: 20px;
    }

    .header h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>ABC INSTITUTE</h1>
        <p>Student Admission & Registration Portal</p>
        <p>Academic Session 2026–2027</p>
    </div>

    <div class="form-content">

    <form id="registrationForm">

        <h2 class="section-title">1. Personal Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>1. Full Name *</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>2. Father's Name *</label>
                <input type="text" placeholder="Enter father's name" required>
            </div>

            <div class="form-group">
                <label>3. Mother's Name *</label>
                <input type="text" placeholder="Enter mother's name" required>
            </div>

            <div class="form-group">
                <label>4. Date of Birth *</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>5. Gender *</label>
                <select required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>6. Category</label>
                <select>
                    <option value="">Select Category</option>
                    <option>General</option>
                    <option>OBC</option>
                    <option>SC</option>
                    <option>ST</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>7. Email Address *</label>
                <input type="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>8. Mobile Number *</label>
                <input type="tel" placeholder="Enter mobile number"
                pattern="[0-9]{10}" maxlength="10" required>
            </div>

            <div class="form-group">
                <label>9. Alternate Contact Number</label>
                <input type="tel" placeholder="Alternate mobile number">
            </div>

            <div class="form-group">
                <label>10. Nationality</label>
                <input type="text" value="Indian">
            </div>

            <div class="form-group full-width">
                <label>11. Residential Address *</label>
                <textarea placeholder="Enter your complete address" required></textarea>
            </div>

        </div>

        <h2 class="section-title">2. Academic Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>12. Previous Qualification *</label>
                <select required>
                    <option value="">Select Qualification</option>
                    <option>10th</option>
                    <option>12th</option>
                    <option>Diploma</option>
                    <option>Graduation</option>
                    <option>Post Graduation</option>
                </select>
            </div>

            <div class="form-group">
                <label>13. Previous School/College</label>
                <input type="text" placeholder="Enter institution name">
            </div>

            <div class="form-group">
                <label>14. Passing Year</label>
                <input type="number" placeholder="e.g. 2025"
                min="1950" max="2026">
            </div>

            <div class="form-group">
                <label>15. Percentage / CGPA</label>
                <input type="text" placeholder="Enter percentage or CGPA">
            </div>

        </div>

        <h2 class="section-title">3. Course Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>16. Select Course *</label>
                <select required>
                    <option value="">Choose Course</option>
                    <option>BCA</option>
                    <option>MCA</option>
                    <option>BBA</option>
                    <option>MBA</option>
                    <option>Computer Science</option>
                    <option>Web Development</option>
                    <option>Graphic Designing</option>
                    <option>Digital Marketing</option>
                </select>
            </div>

            <div class="form-group">
                <label>17. Preferred Batch *</label>
                <select required>
                    <option value="">Select Batch</option>
                    <option>Morning</option>
                    <option>Afternoon</option>
                    <option>Evening</option>
                </select>
            </div>

            <div class="form-group">
                <label>18. Admission Type</label>
                <select>
                    <option>Regular</option>
                    <option>Distance Learning</option>
                    <option>Online</option>
                </select>
            </div>

            <div class="form-group">
                <label>19. How did you hear about us?</label>
                <select>
                    <option value="">Select Option</option>
                    <option>Social Media</option>
                    <option>Friends</option>
                    <option>Newspaper</option>
                    <option>Website</option>
                    <option>Advertisement</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label>20. Why do you want to join this institute?</label>
                <textarea placeholder="Write your reason here..."></textarea>
            </div>

        </div>

        <h2 class="section-title">4. Declaration</h2>

        <div class="checkbox">
            <input type="checkbox" id="agree" required>
            <label for="agree">
                I declare that all the information provided above
                is correct and complete to the best of my knowledge.
            </label>
        </div>

        <button type="submit">Submit Registration</button>

    </form>

    </div>

    <div class="footer">
        © 2026 ABC Institute | All Rights Reserved
        <br>
        Designed for Student Admission & Registration
    </div>

</div>

<script>
document.getElementById("registrationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    alert("Registration submitted successfully!");

    this.reset();

});
</script>

</body>
</html>
